name: 每日18点微信定时推送

# 定时规则：UTC时间！北京时间18点 = UTC 10点
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: # 支持手动点按钮立即测试运行

jobs:
  push-msg:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行推送脚本
        run: python send_msg.py
